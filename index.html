<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Łowca Błędów — TEST</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:24px}
.card{max-width:560px;margin:auto;background:#1d1d1d;border-radius:18px;padding:24px}
h1{margin-top:0}.muted{color:#aaa}.price{font-size:32px;font-weight:700;margin:16px 0}
button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
.test{background:#fff;color:#111}.buy{background:#333;color:#fff}.danger{background:#b00020;color:#fff}
#status{margin-top:18px;padding:14px;border-radius:12px;background:#292929;line-height:1.5}
.badge{display:inline-block;padding:6px 10px;border-radius:8px;background:#b00020}
</style>
</head>
<body>
<div class="card">
<h1>🦅 Łowca Błędów</h1>
<p class="muted">Wersja PWA — test alarmu</p>

<div class="badge">TEST CRITICAL</div>
<h2>Sony A7 IV Body</h2>
<div class="price">7 999 zł → <strong>799 zł</strong></div>
<p>Przykładowy błąd cenowy. To nie jest prawdziwa oferta.</p>

<button class="test" onclick="requestNotifications()">🔔 Włącz powiadomienia</button>
<button class="test" onclick="startTest(1)">🚨 TEST ZA 1 MINUTĘ</button>
<button class="test" onclick="startTest(5)">🚨 TEST ZA 5 MINUT</button>
<button class="test" onclick="startTest(60)">🚨 TEST ZA 60 MINUT</button>
<button class="buy" onclick="secureOffer()">📸 Zabezpiecz ofertę</button>
<button class="buy" onclick="openProduct()">🛒 Kup teraz</button>

<div id="status">Status: gotowy do testu.</div>
</div>

<script>
let timer=null;

async function requestNotifications(){
  if(!('Notification' in window)){
    setStatus('Ta przeglądarka nie obsługuje powiadomień.');
    return;
  }
  const p=await Notification.requestPermission();
  setStatus('Powiadomienia: '+p);
  if(p==='granted') new Notification('🦅 Łowca Błędów — TEST',{body:'Powiadomienia są włączone.'});
}

function startTest(minutes){
  if(timer) clearTimeout(timer);
  const ms=minutes*60*1000;
  const when=new Date(Date.now()+ms);
  setStatus('🚨 Test ustawiony na '+when.toLocaleTimeString('pl-PL')+'. Możesz zamknąć ekran aplikacji.');
  timer=setTimeout(triggerAlarm,ms);
}

function triggerAlarm(){
  const title='🚨 ŁOWCA BŁĘDÓW — TEST';
  const body='Sony A7 IV: 7 999 zł → 799 zł. PRIORYTET CRITICAL.';
  setStatus('<strong>🚨 ALARM!</strong><br>'+body);
  if(navigator.vibrate) navigator.vibrate([500,200,500,200,900]);
  if('Notification' in window && Notification.permission==='granted'){
    new Notification(title,{body,tag:'lowca-test'});
  }
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.25;o.start();
    setTimeout(()=>o.stop(),1500);
  }catch(e){}
}

function secureOffer(){
  const data={
    product:'Sony A7 IV Body',
    oldPrice:7999,
    detectedPrice:799,
    detectedAt:new Date().toISOString(),
    url:location.href,
    note:'TEST — przykładowa oferta, nie jest prawdziwym zakupem.'
  };
  localStorage.setItem('lowca_snapshot',JSON.stringify(data));
  setStatus('📸 Zapisano testowy snapshot oferty: '+new Date().toLocaleString('pl-PL'));
}

function openProduct(){
  alert('W wersji produkcyjnej ten przycisk otworzy prawdziwy URL produktu. Ten ekran jest wyłącznie testowy.');
}

function setStatus(t){document.getElementById('status').innerHTML=t;}
</script>
</body>
</html>
