<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">

<title>Łowca Błędów</title>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {
 await OneSignal.init({
  appId: "a91ec73d-0089-4851-93af-5f91a5e2476a",
  safari_web_id: "web.onesignal.auto.336e9d4c-289f-452d-8560-a451da3453b9",

  serviceWorkerPath: "/lowca-bledow-test/OneSignalSDKWorker.js",

  serviceWorkerParam: {
    scope: "/lowca-bledow-test/"
  },

  notifyButton: {
    enable: true
  }
});
});
</script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  margin: 0;
  padding: 24px;
}

.card {
  max-width: 560px;
  margin: auto;
  background: #1d1d1d;
  border-radius: 18px;
  padding: 24px;
}

h1 {
  margin-top: 0;
}

.muted {
  color: #aaa;
}

.price {
  font-size: 32px;
  font-weight: 700;
  margin: 16px 0;
}

button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: 0;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.test {
  background: #fff;
  color: #111;
}

.buy {
  background: #333;
  color: #fff;
}

#status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 12px;
  background: #292929;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 8px;
  background: #b00020;
}
</style>
</head>

<body>

<div class="card">

<h1>🦅 Łowca Błędów</h1>

<p class="muted">
Test prawdziwych powiadomień push
</p>

<div class="badge">
TEST CRITICAL
</div>

<h2>
Sony A7 IV Body
</h2>

<div class="price">
7 999 zł → <strong>799 zł</strong>
</div>

<p>
Przykładowy błąd cenowy. To nie jest prawdziwa oferta.
</p>

<button class="test" onclick="enablePush()">
🔔 Włącz alarm Łowcy
</button>

<button class="buy" onclick="secureOffer()">
📸 Zabezpiecz ofertę
</button>

<button class="buy" onclick="openProduct()">
🛒 Kup teraz
</button>

<div id="status">
Status: oczekiwanie na uruchomienie OneSignal.
</div>

</div>

<script>

async function enablePush() {

  try {

    if (!window.OneSignal) {

      setStatus(
        "OneSignal jeszcze się ładuje. Spróbuj ponownie za chwilę."
      );

      return;
    }

    await OneSignal.Notifications.requestPermission();

    setStatus(
      "🔔 Sprawdzam zgodę na powiadomienia…"
    );

    const permission =
      await OneSignal.Notifications.permission;

    if (permission) {

      setStatus(
        "✅ Powiadomienia są włączone. Możemy wysłać prawdziwy test z OneSignal."
      );

    } else {

      setStatus(
        "⚠️ Powiadomienia nie zostały włączone."
      );

    }

  } catch (e) {

    setStatus(
      "❌ Błąd OneSignal: " + e.message
    );

  }
}


function secureOffer() {

  localStorage.setItem(
    "lowca_snapshot",
    JSON.stringify({
      product: "Sony A7 IV Body",
      oldPrice: 7999,
      detectedPrice: 799,
      detectedAt: new Date().toISOString(),
      url: location.href
    })
  );

  setStatus(
    "📸 Zapisano testowy snapshot oferty."
  );
}


function openProduct() {

  alert(
    "Wersja testowa — tutaj później otworzymy prawdziwy URL produktu."
  );

}


function setStatus(t) {

  document.getElementById("status").innerHTML = t;

}

</script>

</body>
</html>
