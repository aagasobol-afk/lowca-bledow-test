name: Lowca Bledow - test push

on:
  workflow_dispatch:

jobs:
  send-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Send test push via OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}

        run: |
          curl -sS -X POST "https://api.onesignal.com/notifications" \
            -H "Content-Type: application/json" \
            -H "Authorization: Key ${ONESIGNAL_API_KEY}" \
            -d '{
              "app_id": "'"${ONESIGNAL_APP_ID}"'",
              "target_channel": "push",
              "include_subscription_ids": ["'"${ONESIGNAL_SUBSCRIPTION_ID}"'"],
              "headings": {
                "en": "ŁOWCA BŁĘDÓW — TEST"
              },
              "contents": {
                "en": "Sony A7 IV: 7 999 zł → 799 zł. PRIORYTET CRITICAL."
              }
            }'
