name: Lowca Bledow - discovery v1.0

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lowca-discovery
  cancel-in-progress: true

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install -r requirements-lowca.txt beautifulsoup4

      - name: Restore previous discovery registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous_discovery
          PREV_RUN_ID=$(gh run list --workflow lowca_discovery_v10.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$PREV_RUN_ID" ]; then
            gh run download "$PREV_RUN_ID" --name lowca-discovery-v01 --dir previous_discovery || true
          fi
          if [ -f previous_discovery/lowca_source_registry_v01.json ]; then
            cp previous_discovery/lowca_source_registry_v01.json lowca_source_registry_v01.json
          fi

      - name: Discover stores and products
        run: |
          python lowca_autodiscovery_v01.py
          python lowca_discovery_v11.py > discovered_products.txt
          python - <<'PY'
          import json
          from pathlib import Path

          items = []
          seen = set()
          for line in Path("discovered_products.txt").read_text(encoding="utf-8").splitlines():
              parts = line.split(" ", 1)
              if len(parts) != 2:
                  continue
              store, url = parts
              if not url.startswith(("http://", "https://")):
                  continue
              key = f"{store}|{url}"
              if key not in seen:
                  seen.add(key)
                  items.append([store, url])
              if len(items) >= 120:
                  break

          Path("lowca_discovery_queue_v01.json").write_text(
              json.dumps(
                  {
                      "created_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
                      "count": len(items),
                      "products": items,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"KOLEJKA_DISCOVERY: {len(items)} produktów")
          PY

      - name: Save discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowca-discovery-v01
          path: |
            lowca_discovery_queue_v01.json
            lowca_source_registry_v01.json
          retention-days: 30
          overwrite: true
