name: Lowca Bledow - engine test

on:
  workflow_dispatch:

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install -r requirements-lowca.txt

      - name: Run detector
        run: python lowca_engine_v03.py


      - name: Run 100-case benchmark
        run: python lowca_benchmark_v04.py
