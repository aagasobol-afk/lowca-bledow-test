name: Lowca Bledow - engine test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install -r requirements-lowca.txt

      - name: Run detector
        run: python lowca_engine_v03.py

      - name: Run 100-case benchmark
        run: python lowca_benchmark_v04.py

      - name: Run v0.5 history benchmark
        run: python lowca_history_benchmark_v05.py

      - name: Run v0.6 fusion benchmark
        run: python lowca_fusion_benchmark_v06.py

      - name: Run v0.7 product store benchmark
        run: python lowca_store_benchmark_v07.py

      - name: Run v0.8 end-to-end pipeline
        run: python lowca_e2e_benchmark_v08.py

      - name: Run v0.9 Media Expert adapter benchmark
        run: python lowca_mediaexpert_benchmark_v09.py
